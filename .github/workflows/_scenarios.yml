name: Scenarios

# All the scenario-running logic lives here, once. The per-proxy workflows
# (apache.yml, nginx.yml, ...) are thin callers that only decide *when* to run
# and *which* tree to run, so a change to how a scenario is exercised is a
# one-file change no matter how many proxies the repo grows.

on:
  workflow_call:
    inputs:
      proxy:
        description: "Proxy tree to run, e.g. apache-httpd, nginx. Empty = all."
        type: string
        default: ""
      tier:
        description: >-
          Catalogue tier: `smoke` runs only the rows marked smoke in
          scenarios.tsv, `all` runs every row.
        type: string
        default: "all"
      chunk_size:
        description: >-
          Scenarios per job. 1 gives one job per scenario, which is what you
          want when bisecting a flake. A string, not a number: it is only ever
          handed to a shell script.
        type: string
        default: "8"
      scenario_filter:
        description: "Extra extended-regex filter, ANDed with `proxy`."
        type: string
        default: ""
      include_sse:
        description: "Run the *-sse scenarios. Needs a build whose Flow has the SSE push transport."
        type: boolean
        default: true
      vaadin_version:
        description: "Vaadin version to build (empty = pom default). Also used as the my-app image tag."
        type: string
        default: ""
      flow_version:
        description: "Flow version override, e.g. a branch snapshot. Empty = whatever the platform version pulls in."
        type: string
        default: ""
      java_version:
        description: "JDK for the test runner and the my-app build/runtime image."
        type: string
        default: "21"

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      count: ${{ steps.gen.outputs.count }}
      chunks: ${{ steps.gen.outputs.chunks }}
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve image tag
        id: tag
        run: |
          tag="${{ inputs.vaadin_version }}"
          [ -z "$tag" ] && tag="latest"
          if [ -n "${{ inputs.flow_version }}" ]; then
            # A Flow override yields a different artifact from the same platform
            # version, so give it its own tag instead of overwriting the default.
            tag="$tag-flow-${{ inputs.flow_version }}"
          fi
          echo "image_tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Generate scenario matrix
        id: gen
        run: |
          set -eu
          # `proxy` narrows to one tree; `scenario_filter` narrows further. Both
          # are extended regexes matched against the scenario key, so ANDing them
          # means anchoring the proxy prefix and letting the filter match anywhere
          # after it.
          filter='${{ inputs.proxy }}'
          if [ -n '${{ inputs.scenario_filter }}' ]; then
            filter="${filter:+^$filter.*}"'${{ inputs.scenario_filter }}'
          fi
          # The *-sse scenarios need an app image whose Flow has the SSE push
          # transport. The pom's pinned version may predate it, so they are opt-in.
          exclude=''
          [ "${{ inputs.include_sse }}" = "true" ] || exclude='\-sse$'
          matrix="$(scripts/gen-matrix.sh \
            --tier '${{ inputs.tier }}' \
            --chunk-size '${{ inputs.chunk_size }}' \
            "$filter" "$exclude")"
          chunks="$(echo "$matrix" | jq length)"
          # The scenario count, not the job count: it is what the report job
          # checks its result rows against, and one job now carries several.
          n="$(echo "$matrix" | jq '[.[].scenarios | length] | add // 0')"
          [ "$n" -gt 0 ] \
            || { echo "::error::No scenarios matched tier '${{ inputs.tier }}' and filter '$filter'"; exit 1; }
          # A silently truncated matrix is far worse than a clear failure.
          [ "$chunks" -le 256 ] \
            || { echo "::error::$chunks matrix jobs exceeds GitHub's 256 limit"; exit 1; }
          {
            echo "matrix=$matrix"
            echo "count=$n"
            echo "chunks=$chunks"
          } >> "$GITHUB_OUTPUT"
          echo "Matched $n scenario(s) in $chunks job(s)."
          echo "$matrix" | jq -r '.[] | "  \(.name): \(.scenarios | length) scenario(s)"'

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: prepare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build my-app image
        run: |
          docker build my-app \
            --build-arg VAADIN_VERSION="${{ inputs.vaadin_version }}" \
            --build-arg FLOW_VERSION="${{ inputs.flow_version }}" \
            --build-arg JAVA_VERSION="${{ inputs.java_version }}" \
            -t "vaadin/my-app:${{ needs.prepare.outputs.image_tag }}"

      # One tarball carries everything a scenario job needs, so no test job ever
      # touches Docker Hub. Anonymous pulls are rate-limited per source IP and
      # GitHub-hosted runners share egress, so pulling the proxy image in every
      # job was both a cost and a live flake source.
      #
      # Only the tree under test is shipped. The tree->image mapping lives in
      # proxy-images.txt beside the pins, so a new proxy tree still needs no
      # change here.
      - name: Resolve the pinned proxy images for this run
        id: images
        run: |
          set -eu
          images="$(awk -v t='${{ inputs.proxy }}' \
            '$1 !~ /^#/ && NF >= 2 && (t == "" || $1 == t) { print $2 }' \
            .github/proxy-images.txt)"
          [ -n "$images" ] \
            || { echo "::error::no proxy image in .github/proxy-images.txt for tree '${{ inputs.proxy }}'"; exit 1; }
          echo "Shipping: $(echo "$images" | tr '\n' ' ')"
          echo "list=$(echo "$images" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Pull the pinned proxy images
        run: echo '${{ steps.images.outputs.list }}' | xargs -r -n1 docker pull

      - name: Save images
        run: |
          set -eu
          # shellcheck disable=SC2086
          docker save "vaadin/my-app:${{ needs.prepare.outputs.image_tag }}" \
            ${{ steps.images.outputs.list }} \
            | gzip > images.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: images-${{ inputs.proxy && inputs.proxy || 'all' }}
          path: images.tar.gz
          retention-days: 1
          compression-level: 0

  test:
    # One job per chunk, not per scenario. The per-job fixed cost — checkout,
    # downloading and loading the image tarball, the JDK, Playwright's browser
    # and its system libraries — measured ~87s against ~61s of actual scenario
    # work, so one job per scenario spent over half its time on setup, 112 times
    # per sweep. The matrix name says which slice of the tree a job carries.
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [prepare, build]
    strategy:
      fail-fast: false
      # Matches the effective concurrency ceiling observed on this account, and
      # keeps a large matrix from queueing unpredictably.
      max-parallel: 20
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    env:
      MY_APP_VERSION: ${{ needs.prepare.outputs.image_tag }}
      CHUNK: ${{ toJson(matrix.scenarios) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Artifact names cannot hold a space or a slash, and "apache-httpd 1/5"
      # has both. printf, not echo: `tr -c` would map echo's trailing newline
      # too, leaving the line written to $GITHUB_OUTPUT unterminated.
      - name: Sanitize chunk id
        id: id
        run: echo "id=$(printf '%s' '${{ matrix.name }}' | tr -c 'A-Za-z0-9._-' '-')" >> "$GITHUB_OUTPUT"

      - name: Download images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: images-${{ inputs.proxy && inputs.proxy || 'all' }}

      - name: Load images
        run: docker load < images.tar.gz

      - name: Set up JDK ${{ inputs.java_version }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: maven

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('integration-tests/pom.xml') }}
          restore-keys: playwright-${{ runner.os }}-

      # System libraries for Chromium need root, which the Maven-driven browser
      # install below (running as the runner user) cannot get. Install them via
      # Playwright's npm CLI, which handles sudo. The npm package and the Java
      # binding are released in lockstep, so the version is read out of the pom
      # rather than written here a second time: a Dependabot bump to the pom
      # needs no matching edit in this file, and there is nothing to keep in sync.
      - name: Install Playwright system dependencies
        run: |
          set -eu
          version=$(sed -nE 's|.*<playwright.version>(.*)</playwright.version>.*|\1|p' \
            integration-tests/pom.xml)
          [ -n "$version" ] || { echo "::error::no <playwright.version> in integration-tests/pom.xml"; exit 1; }
          npx --yes "playwright@$version" install-deps chromium

      - name: Install Playwright browser
        working-directory: integration-tests
        run: |
          ./mvnw -ntp -B test-compile
          ./mvnw -ntp -B exec:java \
            -Dexec.classpathScope=test \
            -Dexec.mainClass=com.microsoft.playwright.CLI \
            -Dexec.args="install chromium"

      # Brings up, probes, tests, compression-checks and tears down every
      # scenario in the chunk, one after another, and keeps going after a
      # failure so one broken scenario cannot hide the rest. Writes a
      # results.jsonl row for each and goes red if any failed.
      - name: Run scenarios
        run: scripts/ci-run-chunk.sh

      # Always uploaded, but it is one small JSON line per scenario: the report
      # job needs a row from every scenario, including the ones that passed.
      - name: Upload result rows
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-${{ steps.id.outputs.id }}
          path: results.jsonl
          if-no-files-found: ignore
          retention-days: 7

      # The heavy evidence — reports, traces, logs — only for the scenarios that
      # actually failed. Uploading it on every green run produced dozens of
      # artifacts a run for nothing.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failure-${{ steps.id.outputs.id }}
          path: failure-artifacts/**
          if-no-files-found: ignore
          retention-days: 7

      # ci-run-chunk.sh tears each scenario down as it finishes, so this only
      # catches a job cancelled or timed out mid-scenario. Scoped to this
      # chunk's own compose files rather than `docker rm -f $(docker ps -aq)`:
      # on a self-hosted runner that would take out containers this job never
      # started.
      - name: Tear down any surviving containers
        if: always()
        run: |
          set -eu
          printf '%s' "$CHUNK" | jq -r '.[].scenario' | while read -r scenario; do
            docker compose -f "$scenario/docker-compose.yml" down -v || true
          done

  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [prepare, test]
    if: always() && needs.prepare.result == 'success'
    steps:
      - name: Download result rows
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: results-*
          path: results
          merge-multiple: false

      # The view that did not exist before: one table per proxy tree, sorted so
      # failures come first, readable without opening a single job.
      - name: Write summary
        run: |
          set -eu
          find results -name results.jsonl -exec cat {} + > all.jsonl 2>/dev/null || : > all.jsonl
          expected='${{ needs.prepare.outputs.count }}'
          actual="$(wc -l < all.jsonl | tr -d ' ')"
          {
            echo "## Scenario results — \`${{ inputs.proxy && inputs.proxy || 'all proxies' }}\` (\`${{ inputs.tier }}\` tier)"
            echo
            if [ "$actual" -eq 0 ]; then
              echo "No results were reported. Every test job failed before it could record one."
            else
              jq -rs '
                group_by(.scenario | split("/")[0:2] | join("/"))[]
                | "### " + (.[0].scenario | split("/")[0:2] | join("/"))
                  + " — " + ((map(select(.status == "pass")) | length) | tostring)
                  + "/" + (length | tostring) + " passed\n\n"
                  + "| scenario | transport | tests | compression | result | s |\n"
                  + "|---|---|---|---|---|---:|\n"
                  + (sort_by(.status, .scenario)
                     | map("| `" + (.scenario | split("/")[2:] | join("/")) + "` | "
                           + .transport + " | "
                           + .tests + " | " + .compression + " | "
                           + (if .status == "pass" then "✅" else "❌ **fail**" end) + " | "
                           + (.duration | tostring) + " |")
                     | join("\n"))
                  + "\n"
              ' all.jsonl
            fi
            if [ "$actual" -ne "$expected" ]; then
              echo
              echo "> ⚠️ $actual of $expected scenarios reported a result."
              echo "> The rest were cancelled or died before recording one."
            fi
            if [ '${{ inputs.tier }}' = 'smoke' ]; then
              echo
              echo "> This was the **smoke** tier: one scenario per distinct mechanism."
              echo "> The full catalogue runs on the weekly sweep and on \`workflow_dispatch\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # The report job is what the caller sees, so it has to carry the verdict:
      # a missing row is a failure too, otherwise a cancelled or crashed job
      # would quietly turn the run green. With several scenarios per job that
      # matters more, not less — a job killed mid-chunk loses every row it had
      # not written yet.
      - name: Fail if any scenario failed
        run: |
          set -eu
          expected='${{ needs.prepare.outputs.count }}'
          actual="$(wc -l < all.jsonl | tr -d ' ')"
          failed="$(grep -c '"status":"fail"' all.jsonl || true)"
          echo "$actual/$expected scenarios reported, $failed failed."
          [ "$actual" -eq "$expected" ] || { echo "::error::$((expected - actual)) scenario(s) reported no result"; exit 1; }
          [ "$failed" -eq 0 ] || { echo "::error::$failed scenario(s) failed"; exit 1; }
