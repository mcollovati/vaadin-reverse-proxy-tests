name: All scenarios

# Manual full-matrix run across every proxy tree — what integration-tests.yml
# used to be. The per-proxy workflows cover PRs and pushes; this is for
# deliberate sweeps: a Vaadin version bump, a Flow branch build, or a check
# that nothing drifted across trees.

on:
  workflow_dispatch:
    inputs:
      scenario_filter:
        description: "Extended-regex filter on the scenario key (empty = all scenarios)."
        type: string
        default: ""
      include_sse:
        description: "Run the *-sse scenarios. Needs a build whose Flow has the SSE push transport."
        type: boolean
        default: true
      vaadin_version:
        description: "Vaadin version to build (empty = pom default). Also used as the my-app image tag."
        type: string
        default: ""
      flow_version:
        description: "Flow version override, e.g. a branch snapshot."
        type: string
        default: ""
      java_version:
        description: "JDK for the test runner and the my-app build/runtime image."
        type: string
        default: "21"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scenarios:
    uses: ./.github/workflows/_scenarios.yml
    with:
      scenario_filter: ${{ inputs.scenario_filter }}
      include_sse: ${{ inputs.include_sse }}
      vaadin_version: ${{ inputs.vaadin_version }}
      flow_version: ${{ inputs.flow_version }}
      java_version: ${{ inputs.java_version }}
