name: Integration tests

# Manually dispatched. Builds the my-app image once, then runs the Playwright
# integration suite (integration-tests/) against every reverse-proxy scenario
# in scenarios.tsv as a parallel matrix.
on:
  workflow_dispatch:
    inputs:
      vaadin_version:
        description: "Vaadin version to build (empty = pom default). Also used as the my-app image tag."
        required: false
        default: ""
      scenario_filter:
        description: "Extended-regex filter on the scenario key (empty = all scenarios)."
        required: false
        default: ""
      java_version:
        description: "JDK for the test runner and the my-app build/runtime image."
        required: false
        default: "21"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve image tag
        id: tag
        run: |
          tag="${{ inputs.vaadin_version }}"
          [ -z "$tag" ] && tag="latest"
          echo "image_tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Generate scenario matrix
        id: gen
        run: |
          matrix="$(scripts/gen-matrix.sh "${{ inputs.scenario_filter }}")"
          echo "$matrix" | jq -e 'length > 0' >/dev/null \
            || { echo "::error::No scenarios matched filter '${{ inputs.scenario_filter }}'"; exit 1; }
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Matched $(echo "$matrix" | jq length) scenario(s)."

  build:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v6

      - name: Build my-app image
        run: |
          docker build my-app \
            --build-arg VAADIN_VERSION="${{ inputs.vaadin_version }}" \
            --build-arg JAVA_VERSION="${{ inputs.java_version }}" \
            -t "vaadin/my-app:${{ needs.prepare.outputs.image_tag }}"

      - name: Save image
        run: |
          docker save "vaadin/my-app:${{ needs.prepare.outputs.image_tag }}" \
            | gzip > my-app-image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: my-app-image
          path: my-app-image.tar.gz
          retention-days: 1

  test:
    runs-on: ubuntu-latest
    needs: [prepare, build]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    env:
      COMPOSE_FILE: ${{ matrix.scenario }}/docker-compose.yml
      MY_APP_VERSION: ${{ needs.prepare.outputs.image_tag }}
      SCENARIO_PATHS: ${{ toJson(matrix.paths) }}
    steps:
      - uses: actions/checkout@v6

      - name: Sanitize scenario id
        id: id
        run: echo "id=$(echo '${{ matrix.scenario }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Download my-app image
        uses: actions/download-artifact@v8
        with:
          name: my-app-image

      - name: Load image
        run: docker load < my-app-image.tar.gz

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: maven

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('integration-tests/pom.xml') }}
          restore-keys: playwright-${{ runner.os }}-

      # System libraries for Chromium need root, which the Maven-driven browser
      # install below (running as the runner user) cannot get. Install them via
      # Playwright's npm CLI, which handles sudo. Keep the version in sync with
      # integration-tests/pom.xml's playwright.version.
      - name: Install Playwright system dependencies
        run: npx --yes playwright@1.50.0 install-deps chromium

      - name: Install Playwright browser
        working-directory: integration-tests
        run: |
          ./mvnw -ntp -B test-compile
          ./mvnw -ntp -B exec:java \
            -Dexec.classpathScope=test \
            -Dexec.mainClass=com.microsoft.playwright.CLI \
            -Dexec.args="install chromium"

      - name: Start scenario stack
        run: docker compose -f "$COMPOSE_FILE" up -d --no-build

      - name: Wait for proxy to be ready
        run: |
          set -eu
          fail=0
          for path in $(echo "$SCENARIO_PATHS" | jq -r '.[]'); do
            url="${{ matrix.scheme }}://localhost:${{ matrix.port }}${path}"
            echo "Waiting for $url ..."
            ok=0
            for _ in $(seq 1 60); do
              if curl -fsk -o /dev/null "$url"; then ok=1; break; fi
              sleep 2
            done
            if [ "$ok" -ne 1 ]; then echo "::error::Timed out waiting for $url"; fail=1; fi
          done
          [ "$fail" -eq 0 ]

      # Sticky-cookie load balancers (nginx `sticky cookie`, Apache balancer)
      # round-robin the first, cookie-less request, so a fresh browser session
      # can land on a backend the single readiness probe above never touched.
      # Under CI contention that cold backend's first Vaadin render can exceed
      # Playwright's 5s assertion timeout, failing the suite. Issue a burst of
      # cookie-less requests per path so round-robin warms every backend's JVM
      # before the tests run. No-op overhead for single-backend scenarios.
      - name: Warm all backends
        run: |
          set -eu
          for path in $(echo "$SCENARIO_PATHS" | jq -r '.[]'); do
            url="${{ matrix.scheme }}://localhost:${{ matrix.port }}${path}"
            echo "Warming $url ..."
            for _ in $(seq 1 20); do curl -fsk -o /dev/null "$url" || true; done
          done

      - name: Run integration tests
        run: |
          set -eu
          for path in $(echo "$SCENARIO_PATHS" | jq -r '.[]'); do
            url="${{ matrix.scheme }}://localhost:${{ matrix.port }}${path}"
            echo "::group::Tests against $url"
            ./run-test.sh "$url"
            echo "::endgroup::"
          done

      - name: Collect compose logs
        if: always()
        run: docker compose -f "$COMPOSE_FILE" logs --no-color > compose-logs.txt 2>&1 || true

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-${{ steps.id.outputs.id }}
          path: |
            integration-tests/target/failsafe-reports/**
            compose-logs.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear down scenario stack
        if: always()
        run: docker compose -f "$COMPOSE_FILE" down -v
