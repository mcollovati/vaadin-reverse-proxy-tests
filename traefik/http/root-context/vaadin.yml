# Baseline: app at /, proxy at /. One router, one service, nothing else.
#
# There is no WebSocket configuration because Traefik has none to give: every
# router upgrades when the client asks. Compare apache-httpd's
# `upgrade=websocket` and NGINX's `map $http_upgrade` + Upgrade/Connection
# headers, both of which this file does without.
http:
  routers:
    vaadin:
      rule: PathPrefix(`/`)
      entryPoints:
        - web
      middlewares:
        - compress
      service: vaadin

  services:
    vaadin:
      loadBalancer:
        servers:
          - url: http://vaadin:8080

  middlewares:
    # Compression on, the way a real deployment has it — but never over a
    # streamed response, and not over media. Traefik compresses every type
    # by default and does not skip text/event-stream on its own, and its
    # minResponseBodyBytes default of 1024 means a compressed stream is held
    # until a kilobyte accumulates. So the types to compress are listed, as in
    # NGINX. text/event-stream (SSE push) and text/plain (streaming and long
    # polling, PushHandler sets that content type) are not on the list, and
    # neither is audio or video: compressing a media file drops Accept-Ranges.
    compress:
      compress:
        # An allowlist, the same types as gzip_types (nginx) and `compression type`
        # (HAProxy). Streams (text/event-stream, text/plain) and media stay out.
        includedContentTypes:
          - text/html
          - text/css
          - application/javascript
          - application/json
          - application/xml
          - image/svg+xml
