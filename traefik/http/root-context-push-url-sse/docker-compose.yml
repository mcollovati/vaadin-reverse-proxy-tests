services:
  vaadin:
    image: vaadin/my-app:${MY_APP_VERSION:-latest}
    build: ../../../my-app
    ports:
      - "8080:8080"
    environment:
      # Connect over SSE from the first page load and do not fall back: a proxy
      # that cannot carry SSE must fail visibly, not degrade to long polling.
      - VAADIN_PUSH_TRANSPORT=SERVER_SENT_EVENTS
      - VAADIN_PUSH_URL=/VAADIN/push
  web:
    depends_on:
      - vaadin
    image: "traefik:${TRAEFIK_VERSION:-v3.7}"
    volumes:
      - ../../traefik.yml:/etc/traefik/traefik.yml:ro
      - ./vaadin.yml:/etc/traefik/dynamic/vaadin.yml:ro
    ports:
      - "9090:80"
