services:
  vaadin-1:
    image: vaadin/my-app:${MY_APP_VERSION:-latest}
    build: ../../../my-app
    ports:
      - "8080:8080"
    environment:
      APP_NAME: My App on vaadin-1
      VAADIN_PUSH_TRANSPORT: SERVER_SENT_EVENTS
  vaadin-2:
    image: vaadin/my-app:${MY_APP_VERSION:-latest}
    build: ../../../my-app
    ports:
      - "7070:8080"
    environment:
      APP_NAME: My App on vaadin-2
      VAADIN_PUSH_TRANSPORT: SERVER_SENT_EVENTS
  web:
    depends_on:
      - vaadin-1
      - vaadin-2
    image: "traefik:${TRAEFIK_VERSION:-v3.7}"
    volumes:
      - ../../traefik.yml:/etc/traefik/traefik.yml:ro
      - ./vaadin.yml:/etc/traefik/dynamic/vaadin.yml:ro
    ports:
      - "9090:80"
