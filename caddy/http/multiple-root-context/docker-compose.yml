services:
  vaadin1:
    image: vaadin/my-app:${MY_APP_VERSION:-latest}
    build: ../../../my-app
    ports:
      - "8080:8080"
    environment:
      APP_NAME: My App One
      # Distinct session cookie names so the two apps do not overwrite each
      # other's session in a browser that visits both. The csrfToken cookie has
      # the same name in both apps and cannot be renamed — that one is kept
      # apart by the proxy rescoping its Path, see vaadin.caddyfile.
      SERVER_SERVLET_SESSION_COOKIE_NAME: JSIDONE
  vaadin2:
    image: vaadin/my-app:${MY_APP_VERSION:-latest}
    build: ../../../my-app
    ports:
      - "7080:8080"
    environment:
      APP_NAME: The other app
      SERVER_SERVLET_SESSION_COOKIE_NAME: JSIDTWO
  web:
    depends_on:
      - vaadin1
      - vaadin2
    image: "${CADDY_IMAGE:-caddy:2.11.9}"
    # The image runs `caddy run --config /etc/caddy/Caddyfile` by default, so the
    # shared Caddyfile is mounted over that path and imports the scenario's site
    # block from /etc/caddy/vaadin.caddyfile. Base and scenario only load as a pair.
    volumes:
      - ../../Caddyfile:/etc/caddy/Caddyfile:ro
      - ./vaadin.caddyfile:/etc/caddy/vaadin.caddyfile:ro
    ports:
      - "9090:80"
