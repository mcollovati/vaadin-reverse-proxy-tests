services:
  vaadin:
    image: vaadin/my-app:${MY_APP_VERSION:-latest}
    build: ../../../my-app
    ports:
      - "8080:8080"
    environment:
      # Relocate the Vaadin PUSH endpoint. The proxy needs no rule of its own for
      # it: reverse_proxy upgrades on whichever path the client asks, so this
      # scenario mounts the very same config file as its sibling.
      VAADIN_PUSH_URL: /VAADIN/push
  web:
    depends_on:
      - vaadin
    image: "${CADDY_IMAGE:-caddy:2.11.9}"
    # The image runs `caddy run --config /etc/caddy/Caddyfile` by default, so the
    # shared Caddyfile is mounted over that path and imports the scenario's site
    # block from /etc/caddy/vaadin.caddyfile. Base and scenario only load as a pair.
    volumes:
      - ../../Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../templates/strip-prefix.caddyfile:/etc/caddy/vaadin.caddyfile:ro
    ports:
      - "9090:80"
