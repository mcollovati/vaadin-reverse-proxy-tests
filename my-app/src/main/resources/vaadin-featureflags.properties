# Server-sent events as a push transport (Flow PR vaadin/flow#24484).
# Enabling the flag only makes Transport.SERVER_SENT_EVENTS selectable; the
# default transport is still WEBSOCKET_XHR, so scenarios that do not ask for
# SSE are unaffected. Flow builds without the flag log a harmless
# "Unsupported feature flag is present" warning at startup.
com.vaadin.experimental.ssePushTransport=true
