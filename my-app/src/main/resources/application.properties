server.port=${PORT:8080}

# Push is enabled here rather than with @Push on Application, so that a scenario
# can choose the transport. With the annotation present, the client-routing
# bootstrap re-applies it through AppShellRegistry.modifyPushConfiguration after
# UIInitEvent has fired, which overwrites whatever PushTransportConfigurer set
# and forces every scenario to start over WEBSOCKET_XHR. That method is a no-op
# when no @Push annotation exists, so the transport chosen in the UI init
# listener survives and the first push connection uses it.
vaadin.pushMode = automatic

logging.level.org.atmosphere = warn
spring.mustache.check-template-location = false

# Launch the default browser when starting the application in development mode
#vaadin.launch-browser=true
# To improve the performance during development.
# For more information https://vaadin.com/docs/flow/spring/tutorial-spring-configuration.html#special-configuration-parameters
vaadin.whitelisted-packages = com.vaadin,org.vaadin,dev.hilla,com.example.application
spring.jpa.defer-datasource-initialization = true
