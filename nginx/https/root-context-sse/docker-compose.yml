services:
  vaadin:
    image: vaadin/my-app:${MY_APP_VERSION:-latest}
    build: ../../../my-app
    ports:
      - "8080:8080"
    environment:
      - VAADIN_PUSH_TRANSPORT=SERVER_SENT_EVENTS
      # Honor X-Forwarded-Proto: https from the proxy so Vaadin builds the push
      # URL with the public scheme and the event stream is not blocked as mixed
      # content.
      - SERVER_FORWARD_HEADERS_STRATEGY=NATIVE
  web:
    depends_on:
      - vaadin
    image: nginx
    volumes:
      - ./default.conf.template:/etc/nginx/templates/default.conf.template
      - ../../../tls/localhost.crt:/etc/nginx/tls/localhost.crt:ro
      - ../../../tls/localhost.key:/etc/nginx/tls/localhost.key:ro
    ports:
      - "9443:443"
    environment:
      - VAADIN_PATH=/
