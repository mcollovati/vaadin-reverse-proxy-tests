services:
  vaadin:
    image: vaadin/my-app:${MY_APP_VERSION:-latest}
    build: ../../../my-app
    ports:
      - "8080:8080"
    environment:
      VAADIN_PUSH_TRANSPORT: SERVER_SENT_EVENTS
      # Honor X-Forwarded-Proto: https from the proxy so Vaadin builds the push
      # URL with the public scheme and the event stream is not blocked as mixed
      # content.
      SERVER_FORWARD_HEADERS_STRATEGY: NATIVE
  https:
    depends_on:
      - vaadin
    image: "httpd:latest"
    ports:
      - "9443:443"
    volumes:
      - ../../httpd.conf:/usr/local/apache2/conf/httpd.conf
      - ./vaadin.conf:/usr/local/apache2/conf/extra/httpd-vaadin-http.conf
      - ../../../tls/localhost.crt:/usr/local/apache2/conf/server.crt:ro
      - ../../../tls/localhost.key:/usr/local/apache2/conf/server.key:ro
