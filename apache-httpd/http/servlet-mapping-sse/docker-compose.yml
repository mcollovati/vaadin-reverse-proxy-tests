services:
  vaadin:
    image: vaadin/my-app:${MY_APP_VERSION:-latest}
    build: ../../../my-app
    ports:
      - "8080:8080"
    environment:
      # Connect over SSE from the first page load and do not fall back: a proxy
      # that cannot carry SSE must fail visibly, not degrade to long polling.
      VAADIN_PUSH_TRANSPORT: SERVER_SENT_EVENTS
      VAADIN_URL_MAPPING: /ui/*
  http:
    depends_on:
      - vaadin
    image: "${HTTPD_IMAGE:-httpd:2.4.68}"
    ports:
      - "9090:80"
    volumes:
      - ../../httpd.conf:/usr/local/apache2/conf/httpd.conf
      - ./vaadin.conf:/usr/local/apache2/conf/extra/httpd-vaadin-http.conf
