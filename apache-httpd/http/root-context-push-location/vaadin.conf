# Upgrade is allowed on the push paths only: each one gets its own block with
# upgrade=websocket, while the catch-all proxies plain HTTP. The root-context
# sibling does the opposite and puts upgrade=websocket on the catch-all.
#
# Push sits at its default location: the browser asks for /VAADIN/push,
# which reaches /VAADIN/push on the backend. VAADIN_PUSH_URL cannot move it:
# the variable has been ignored since Flow 23 (issue #43).
#
# http:// with upgrade=websocket rather than ws://: since httpd 2.4.47 that
# upgrades only when the client asks for one, so the same block carries
# WebSocket, SSE and long polling. A ws:// worker serves WebSocket only, and
# SSE both streams from and POSTs its client-to-server messages to this path.
#
# ORDER MATTERS. mod_proxy shares a worker when one worker URL is a leading
# substring of another defined later, and the later one is then never created --
# it silently inherits the first worker's parameters, losing upgrade=websocket
# here. The push blocks must therefore come before the catch-all, longest
# backend URL first. (This did not bite with ws://, where the differing scheme
# made the URLs non-overlapping.)

<Location /VAADIN/push>
    ProxyPass               http://vaadin:8080/VAADIN/push upgrade=websocket
</Location>

<Location /HILLA/push>
    ProxyPass               http://vaadin:8080/HILLA/push upgrade=websocket
</Location>

<Location />
    ProxyPass               http://vaadin:8080/
    ProxyPassReverse        http://vaadin:8080/
</Location>
