services:
  vaadin-1:
    image: vaadin/my-app:${MY_APP_VERSION:-latest}
    build: ../../../my-app
    ports:
      - "8080:8080"
    environment:
      APP_NAME: My App on vaadin-1
  vaadin-2:
    image: vaadin/my-app:${MY_APP_VERSION:-latest}
    build: ../../../my-app
    ports:
      - "7070:8080"
    environment:
      APP_NAME: My App on vaadin-2
  http:
    depends_on:
      - vaadin-1
      - vaadin-2
    image: "httpd:latest"
    ports:
      - "9090:80"
    volumes:
      - ../../httpd.conf:/usr/local/apache2/conf/httpd.conf
      - ./vaadin.conf:/usr/local/apache2/conf/extra/httpd-vaadin-http.conf
