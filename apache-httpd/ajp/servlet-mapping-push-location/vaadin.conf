# PUSH bypasses AJP, which cannot carry WebSocket frames: the push paths get
# their own HTTP block with upgrade=websocket and everything else goes over
# AJP, so SSE and long-polling push travel over HTTP too. The servlet-mapping
# sibling does it the other way round, with a server-scope RewriteRule that
# sends every upgrade request to a ws:// worker.
#
# Push sits at its default location: the browser asks for /ui/VAADIN/push,
# which reaches /ui/VAADIN/push on the backend. VAADIN_PUSH_URL cannot move it:
# the variable has been ignored since Flow 23 (issue #43).
#
# http:// with upgrade=websocket rather than ws://: since httpd 2.4.47 that
# upgrades only when the client asks for one, so the same block carries
# WebSocket, SSE and long polling. A ws:// worker serves WebSocket only, and
# SSE both streams from and POSTs its client-to-server messages to this path.

# Hilla browser-callables (/connect/*) live at backend root, not under /ui.
ProxyPass           /ui/HILLA/push     http://vaadin:8080/HILLA/push upgrade=websocket
ProxyPass           /ui/VAADIN/push    http://vaadin:8080/ui/VAADIN/push upgrade=websocket
ProxyPass           /ui/HILLA/         ajp://vaadin:8009/HILLA/ flushpackets=on
ProxyPass           /ui/connect/       ajp://vaadin:8009/connect/ flushpackets=on
ProxyPass           /                  ajp://vaadin:8009/ flushpackets=on
