# Shared configuration, mounted read-only by every HAProxy scenario as
# conf.d/00-base.cfg, the way apache-httpd/httpd.conf is shared. The scenario's
# own file is mounted beside it as conf.d/10-vaadin.cfg and the container runs
# `haproxy -f /usr/local/etc/haproxy/conf.d`, which concatenates the directory
# in lexical order. Base and scenario only parse as a pair.
#
# Nothing here configures WebSocket, because HAProxy has no switch for it: an
# HTTP/1.1 upgrade is relayed transparently on whatever path it arrives on.
# That is why the *-push-url scenarios need no rule of their own — they mount
# the same template as their sibling — and why the *-sse ones have to deny the
# upgrade explicitly instead of simply omitting support for it.

global
    log stdout format raw local0 info
    maxconn 4096

# Two defaults sections rather than one, and not by choice: a named defaults
# that carries http-request rules can be inherited by frontends or by backends,
# never by both. HAProxy rejects the config outright —
#   "frontends and backends cannot inherit from the same defaults section if it
#    defines TCP/HTTP rules"
# — so the rule-free half lives here and the rules hang off the second section,
# which only frontends use.
defaults vaadin
    mode http
    log global
    option httplog
    option forwardfor

    timeout connect 5s
    timeout client  300s
    timeout server  300s
    # The knob no other tree in this repo has an equivalent for. Once a
    # connection has been upgraded it stops being a request, and `timeout
    # tunnel` governs it in place of client/server — Apache has ProxyTimeout
    # and NGINX proxy_read_timeout for both phases alike. Vaadin's PUSH
    # heartbeat is every 60s so neither value is ever reached; they are written
    # down because HAProxy's own default is no timeout at all, which turns a
    # dead peer into a leaked connection.
    timeout tunnel  1h

    # Compression on, the way a real deployment has it — but never over a
    # streamed response. Like NGINX's gzip_types this is an allowlist, so
    # text/event-stream (SSE push) and text/plain (streaming and long polling —
    # PushHandler sets that content type) stay out by simply not being named.
    # Compare Traefik, where the same list is a denylist and the streamed types
    # have to be excluded by hand in every scenario.
    #
    # One line: a backslash at the end of a line does NOT continue a directive
    # here, the next line is parsed as a new keyword and the config is rejected.
    compression algo gzip
    compression type text/html text/css application/javascript application/json application/xml image/svg+xml

defaults vaadin-front from vaadin
    # HAProxy sends no X-Forwarded-Proto of its own. Deriving it from the
    # bind's TLS state means the https scenarios need no rule of their own —
    # compare `RequestHeader set X-Forwarded-Proto "https"` (apache-httpd/https)
    # and `proxy_set_header X-Forwarded-Proto $scheme` (nginx/https).
    http-request set-header X-Forwarded-Proto %[ssl_fc,iif(https,http)]
