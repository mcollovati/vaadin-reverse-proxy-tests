# Two independent apps, both at their own backend's root, published under
# different prefixes. Neither backend has a context path: the prefix exists only
# in the public URL.
#
# Two rule-order traps live in this file, and neither shows up in `haproxy -c`.
# HAProxy evaluates the whole http-request ruleset *before* use_backend:
#
#   1. A prefix strip in the frontend would erase the prefix the routing ACL
#      matches on, and every request would answer 503 with vaadin-in/<NOSRV> in
#      the log. So each backend strips its own prefix, which it is allowed to do.
#   2. An unconditional deny meant as "nothing outside the two prefixes exists"
#      would deny the two prefixes as well. Hence `unless app1 or app2`.
#
# On the way out each backend rescopes what it says about itself. That is what
# keeps the two apps apart: their session cookies have distinct names (see the
# compose file), but both issue a csrfToken under the same name, and without the
# Path rewrite the second app visited would clobber the first one's token and
# break Hilla for it. Compare traefik/http/multiple-root-context, which cannot
# rewrite a response and has to tell each app its public prefix instead.
frontend vaadin-in from vaadin-front
    bind :80

    acl app1 path /ui1
    acl app1 path_beg /ui1/
    acl app2 path /ui2
    acl app2 path_beg /ui2/

    use_backend vaadin-app-1 if app1
    use_backend vaadin-app-2 if app2
    http-request deny deny_status 404 unless app1 or app2

backend vaadin-app-1 from vaadin
    # /ui1 -> /, /ui1/foo -> /foo. The optional slash keeps the bare prefix
    # working without a redirect to add a trailing one.
    http-request replace-path ^/ui1/?(.*) /\1
    http-response replace-header Location ^(https?://[^/]+)?/(.*) \1/ui1/\2
    http-response replace-header Set-Cookie (.*;\s*[Pp]ath=)/(;.*)?$ \1/ui1\2
    server vaadin1 vaadin1:8080

backend vaadin-app-2 from vaadin
    http-request replace-path ^/ui2/?(.*) /\1
    http-response replace-header Location ^(https?://[^/]+)?/(.*) \1/ui2/\2
    http-response replace-header Set-Cookie (.*;\s*[Pp]ath=)/(;.*)?$ \1/ui2\2
    server vaadin2 vaadin2:8080
