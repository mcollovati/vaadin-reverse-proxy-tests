services:
  vaadin:
    image: vaadin/my-app:${MY_APP_VERSION:-latest}
    build: ../../../my-app
    ports:
      - "8080:8080"
    environment:
      - SERVER_SERVLET_CONTEXT_PATH=/app
      # Resolved against the context, so the browser asks for /app/VAADIN/push.
      - VAADIN_PUSH_URL=/VAADIN/push
  web:
    depends_on:
      - vaadin
    image: "${HAPROXY_IMAGE:-haproxy:3.2.23}"
    # The image entrypoint prepends `haproxy -W -db` to an argument list that
    # starts with a dash. Pointing -f at a directory is what lets the shared
    # base and the scenario config be two mounts: HAProxy concatenates them.
    command: ["-f", "/usr/local/etc/haproxy/conf.d"]
    volumes:
      - ../../haproxy-base.cfg:/usr/local/etc/haproxy/conf.d/00-base.cfg:ro
      - ../../templates/passthrough.cfg:/usr/local/etc/haproxy/conf.d/10-vaadin.cfg:ro
    ports:
      - "9090:80"
